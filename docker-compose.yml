name: proyecto-recomendaciones

networks:
  bigdata-net:
    name: bigdata-net
    driver: bridge

volumes:
  zookeeper_data:
  kafka_data:
  cassandra_data:
  neo4j_data:
  spark_data:

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: zookeeper
    networks:
      - bigdata-net
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: kafka
    networks:
      - bigdata-net
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: "zookeeper:2181"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_JVM_PERFORMANCE_OPTS: -Xms128m -Xmx192m -Djava.awt.headless=true
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 30s

  cassandra:
    image: cassandra:4.1.3
    container_name: cassandra
    restart: unless-stopped
    networks:
      - bigdata-net
    ports:
      - "9042:9042"
    environment:
      CASSANDRA_CLUSTER_NAME: RecomCluster
      MAX_HEAP_SIZE: ${CASSANDRA_MAX_HEAP:-1G}
      HEAP_NEWSIZE: ${CASSANDRA_HEAP_NEWSIZE:-200M}
    volumes:
      - cassandra_data:/var/lib/cassandra

  spark-master:
    build:
      context: ./spark
    image: proyecto-recomendaciones/spark:3.5.0-numpy
    container_name: spark-master
    networks:
      - bigdata-net
    # La imagen oficial no usa SPARK_MODE: el entrypoint requiere un comando explícito.
    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.master.Master
      - --host
      - spark-master
      - --port
      - "7077"
      - --webui-port
      - "8080"
    environment:
      HOME: /tmp
      SPARK_DAEMON_MEMORY: 256m
      CASSANDRA_HOST: cassandra
      CASSANDRA_PORT: "9042"
    ports:
      - "8080:8080"
      - "7077:7077"
    volumes:
      - spark_data:/opt/spark/data
      - ./spark/jobs:/opt/spark/jobs:ro

  spark-worker:
    build:
      context: ./spark
    image: proyecto-recomendaciones/spark:3.5.0-numpy
    container_name: spark-worker
    networks:
      - bigdata-net
    depends_on:
      - spark-master
    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.worker.Worker
      - spark://spark-master:7077
      - --webui-port
      - "8081"
      - --memory
      - ${SPARK_WORKER_MEMORY:-2G}
      - --cores
      - ${SPARK_WORKER_CORES:-2}
    environment:
      HOME: /tmp
      SPARK_DAEMON_MEMORY: 256m
      SPARK_WORKER_MEMORY: ${SPARK_WORKER_MEMORY:-1G}
      SPARK_WORKER_CORES: ${SPARK_WORKER_CORES:-2}
      CASSANDRA_HOST: cassandra
      CASSANDRA_PORT: "9042"
    ports:
      - "8081:8081"
    volumes:
      - spark_data:/opt/spark/data
      - ./spark/jobs:/opt/spark/jobs:ro

  neo4j:
    image: neo4j:5.15.0
    container_name: neo4j
    networks:
      - bigdata-net
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-password123}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_server_memory_heap_initial__size: ${NEO4J_HEAP:-512m}
      NEO4J_server_memory_heap_max__size: ${NEO4J_HEAP:-512m}
      NEO4J_server_memory_pagecache_size: ${NEO4J_PAGECACHE:-256m}
    volumes:
      - neo4j_data:/data
